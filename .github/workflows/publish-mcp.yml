name: Publish MCP Registry metadata

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'skysay-ai/skysay-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out public connection metadata
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check intended namespace and endpoint
        run: |
          jq -e '
            .name == "io.github.skysay-ai/skysay" and
            .repository.url == "https://github.com/skysay-ai/skysay-mcp" and
            (.description | length) <= 100 and
            .remotes == [{"type":"streamable-http","url":"https://api.skysay.ai/mcp"}] and
            (has("packages") | not)
          ' server.json

      - name: Install checksum-pinned official publisher
        run: |
          task_publisher_dir="$(mktemp -d)"
          curl --fail --show-error --silent --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$task_publisher_dir/archive.tar.gz"
          printf '%s  %s\n' \
            a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc \
            "$task_publisher_dir/archive.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$task_publisher_dir/archive.tar.gz" \
            --directory "$task_publisher_dir" mcp-publisher
          chmod +x "$task_publisher_dir/mcp-publisher"
          printf '%s\n' "$task_publisher_dir" >> "$GITHUB_PATH"

      - name: Validate registry metadata
        run: mcp-publisher validate server.json

      - name: Authenticate repository identity to MCP Registry
        run: mcp-publisher login github-oidc

      - name: Publish metadata for the hosted endpoint
        run: mcp-publisher publish server.json
